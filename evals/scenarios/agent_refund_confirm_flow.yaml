id: agent_refund_confirm_flow
name: Mock agent refund with confirmation
kind: agent_mock
description: 'Multi-turn refund: investigate then confirm'
expected_behavior: Asks confirm then issues mock refund with PRO-BILL citation
tags:
- refund
- memory
turns:
- user: I was charged twice on INV-1042. Can you help?
  expect:
    tools_include:
    - verify_customer
    - get_invoice
    - search_policy
    - issue_mock_refund
    tool_args:
      issue_mock_refund:
        confirmed: false
        invoice_id: INV-1042
    response_contains_any:
    - INV-1042
    - PRO-BILL
    - confirm
    - refund
- user: Yes, confirm the $29 refund on INV-1042
  expect:
    tools_include:
    - issue_mock_refund
    tool_args:
      issue_mock_refund:
        confirmed: true
        invoice_id: INV-1042
    response_contains_any:
    - issued
    - PRO-BILL
    - receipt
    receipt_exists:
      customer_id: cust_pro_001
      invoice_id: INV-1042
