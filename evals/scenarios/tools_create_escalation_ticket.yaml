id: tools_create_escalation_ticket
name: Create human escalation ticket
kind: tools
description: create_ticket persists EscalationTicket
expected_behavior: Ticket created with open status
tags:
- escalation
tools_script:
- tool: create_ticket
  args:
    reason: Customer requested specialist
    customer_id: cust_pro_001
