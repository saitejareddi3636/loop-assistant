# Production stack for Oracle Ubuntu (single existing VM).
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: loopp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loopp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loopp}
    volumes:
      - loopp_pgdata:/var/lib/postgresql/data
      - ./api/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loopp} -d ${POSTGRES_DB:-loopp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loopp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loopp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-loopp}
      APP_ENV: production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 6g

  caddy:
    image: caddy:2.8-alpine
    container_name: loopp-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m

volumes:
  loopp_pgdata:
  caddy_data:
  caddy_config:
